name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 / MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test GSI edition
        shell: pwsh
        run: |
          .\build\Release\cspromator-gsi.exe status
          .\build\Release\cspromator-gsi.exe clock

      - name: Smoke-test Extended edition
        shell: pwsh
        run: |
          .\build\Release\cspromator-extended.exe status
          .\build\Release\cspromator-extended.exe clock

      - name: Install staged files
        run: cmake --install build --config Release

      - name: Assemble portable packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-gsi | Out-Null
          New-Item -ItemType Directory -Force -Path package-extended | Out-Null

          Copy-Item stage\bin\cspromator-gsi.exe package-gsi\
          Copy-Item stage\bin\cspromator-extended.exe package-extended\

          foreach ($package in @('package-gsi', 'package-extended')) {
            Copy-Item config\gamestate_integration_cspromator.cfg $package\
            Copy-Item scripts\install-gsi.ps1 $package\
            Copy-Item README.md $package\
            Copy-Item docs "$package\docs" -Recurse
          }

      - name: Upload GSI Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CSPromator-0.0.8-GSI-windows-x64
          path: package-gsi/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Extended Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CSPromator-0.0.8-Extended-windows-x64
          path: package-extended/
          if-no-files-found: error
          retention-days: 14
