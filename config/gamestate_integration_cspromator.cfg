"CSPromator Telemetry Probe"
{
    "uri"       "http://127.0.0.1:3010/"
    "timeout"   "5.0"

    // Probe profile: deliberately low buffering/throttling so we can measure
    // what CS2 actually emits. We can raise these later if needed.
    "buffer"    "0.0"
    "throttle"  "0.0"
    "heartbeat" "5.0"

    "output"
    {
        "precision_time"     "3"
        "precision_position" "3"
        "precision_vector"   "3"
    }

    "data"
    {
        "provider"               "1"
        "tournamentdraft"        "1"
        "map"                    "1"
        "map_round_wins"         "1"
        "round"                  "1"
        "player_id"              "1"
        "player_state"           "1"
        "player_weapons"         "1"
        "player_match_stats"     "1"
        "player_position"        "1"
        "phase_countdowns"       "1"
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons"     "1"
        "allplayers_position"    "1"
        "allgrenades"            "1"
        "bomb"                   "1"
    }
}
